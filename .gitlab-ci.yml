# CI cho mgmt-device: kiểm khói giao diện, kiểm tầng API, quét bảo mật, dựng ảnh Docker.
# Pipeline đỏ thì chặn merge (bật ở Settings → Merge requests → Pipelines must succeed).
stages: [test, build]

variables:
  GIT_DEPTH: "20"

# Bộ kiểm thử chạy index.html trong jsdom và cần MỘT ảnh chụp dữ liệu ở thư mục gốc.
# CI không có database nên dùng fixture 30 tài sản cố định trong repo — đủ phủ mọi ca
# (thiết bị có ô U, linh kiện có cha, đồ trong kho, bản chưa gán mã, nhiều loại và trạng thái).
kiem-thu:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [node_modules/]
  before_script:
    - npm ci --no-audit --no-fund
    - cp tests/fixture-30.json api-data.json
  script:
    - npm test
  artifacts:
    when: always
    expire_in: 1 week
    paths: [api-data.json]

# Chỉ dựng ảnh để bắt lỗi Dockerfile sớm; KHÔNG đẩy lên registry, KHÔNG triển khai.
dung-anh:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t mgmt-device-api:ci ./api
    - docker run --rm mgmt-device-api:ci python -c "import app; print('app.py nạp được, %d route' % len(app.app.routes))"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Kiểm tầng API bằng HTTP thật, trên một Postgres dựng riêng cho pipeline. Bộ kiểm tự đối
# chiếu với bảng route của FastAPI nên thêm endpoint ghi mà quên viết ca kiểm là job này đỏ.
kiem-api:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: db
  variables:
    POSTGRES_DB: mgmt_device_ci
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci-chi-dung-trong-pipeline
    DATABASE_URL: "postgresql://ci:ci-chi-dung-trong-pipeline@db:5432/mgmt_device_ci"
    SCHEMA_SQL: db/schema.sql
    BACKUP_DIR: /tmp/backup-ci
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
    - pip install -q -r api/requirements.txt
  script:
    - PYTHONPATH=api python tests/api/chay_api.py

# Quét bảo mật. Ngưỡng và lý do của từng ngưỡng ghi trong scripts/quet_bao_mat.sh.
quet-bao-mat:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -q bandit pip-audit
  script:
    # Bandit: chặn mức HIGH. Cảnh báo MEDIUM B608 là báo nhầm — xem nhóm "Chống tiêm SQL"
    # trong tests/api/chay_api.py, ở đó thử tiêm thật chứ không chỉ đọc code rồi tin.
    - bandit -r api scripts -q -lll
    # pip-audit: chặn MỌI lỗ hổng; phụ thuộc Python nâng version là xong, không có cớ để nợ.
    - pip-audit -r api/requirements.txt --progress-spinner off

# Quét ảnh container. Chặn HIGH/CRITICAL CÓ BẢN VÁ: gói hệ điều hành luôn tồn một mớ CVE
# Debian chưa phát hành vá, bắt về 0 tuyệt đối thì hoặc không bao giờ xanh, hoặc phải bỏ qua
# bừa. Ship một CVE đã có vá mới là lỗi của mình — đó mới là thứ đáng chặn.
quet-anh:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t mgmt-device-api:ci ./api
    - docker save mgmt-device-api:ci -o /tmp/anh.tar
    - docker run --rm -v /tmp:/t aquasec/trivy:latest image --input /t/anh.tar
        --severity HIGH,CRITICAL --scanners vuln --ignore-unfixed --exit-code 1 --quiet
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
