server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
    location /cv {
	try_files $uri $uri/ /cv-landing-builder.html;
	add_header Cache-Control "no-store";
	}
    location /kinhdich {
	try_files $uri $uri/ /gieo-que-kinh-dich.html;
    	add_header Cache-Control "no-store";
        }
    location /tarot {
	try_files $uri $uri/ /xem-bai-tarot.html;
	add_header Cache-Control "no-store";
        }

    # Resolver của Docker + biến upstream: nginx không chết nếu api chưa lên khi khởi động.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }
}
